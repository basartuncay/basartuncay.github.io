    li.children[0].textContent = pad(t.getHours()) + ":" + pad(t.getMinutes());
    li.children[1].textContent = node.name;
    li.children[2].textContent = mins < 60 ? "in " + mins + " min" : "in " + Math.floor(mins / 60) + " h " + pad(mins % 60) + " min";
    ol.appendChild(li);
  }
}
let lastMin = -1;
function tick() {
  const d = new Date(); $("saat").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  const w = berlin(d); $("berlin").textContent = "BERLIN " + pad(w.h) + ":" + pad(w.mi);
  if (w.mi !== lastMin) { lastMin = w.mi; nextList(); if (sel >= 0) { day(NODES[sel]); $("d-next").textContent = nextText(parse(NODES[sel].schedule), d, NODES[sel].state); } }
}
tick(); setInterval(tick, 1000);
const first = upcoming(NODES, new Date(), 1)[0];
const initial = first ? NODES.indexOf(first.node) : 0;
show(initial);

/* mood */
const moodBtn = $("mood"), label = () => (moodBtn.textContent = root.dataset.mood === "gothic" ? "HUD" : "Gothic");
moodBtn.hidden = !new URLSearchParams(location.search).has("mood"); label(); // the switch shows only to someone who came in with ?mood=
moodBtn.setAttribute("aria-label", "Switch mood");
moodBtn.addEventListener("click", () => {
  const m = root.dataset.mood === "gothic" ? "hud" : "gothic"; root.dataset.mood = m; label();
  const u = new URL(location.href); u.searchParams.set("mood", m); history.replaceState(null, "", u);
  setPoster(m); if (scene) scene.setMood(m);
});
function setPoster(m) { $("poster").src = "/assets/core/poster-" + m + ".webp"; $("poster-phone").srcset = "/assets/core/poster-" + m + "-phone.webp"; }
if (root.dataset.mood === "gothic") setPoster("gothic");

/* ---------- 3D scene ---------- */
function webgl() { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (_) { return false; } }
const saveData = !!(navigator.connection && navigator.connection.saveData);
if (!webgl() || saveData || qs.has("poster-only")) root.classList.add("no-scene");
else try {
  const { createCore } = await import("/assets/core/scene.js");
  const tag = $("tag"), cv = $("gl");
  const wide = matchMedia("(min-width: 1024px)").matches;
  let panels = []; const measure = () => (panels = [...document.querySelectorAll(".hud > :not(.head)")].map((n) => n.getBoundingClientRect())
    .concat([...document.querySelectorAll(".head > *")].map((n) => { const r = document.createRange(); r.selectNodeContents(n); return r.getBoundingClientRect(); })));
  measure(); addEventListener("resize", measure); setTimeout(measure, 1200); // after the panels' entrance
  const rl = data.groups.map((g) => { const e = document.createElement("span"); e.className = "rl"; e.textContent = g.label; $("rlabels").appendChild(e); return e; });
  scene = createCore({
    canvas: cv, data, mood: root.dataset.mood, reduce, mode: "full", phone: innerWidth <= 760, perf: qs.get("perf") === "1", glass: qs.get("glass") !== "0", initial,
    onSelect(i) { if (i >= 0) show(i); tag.hidden = i < 0; },
    onFrame(api) {
      if (wide) rl.forEach((e, k) => {
        const p = api.ringTop(k), w = e.offsetWidth, h = e.offsetHeight;
        const x = p && Math.round(p.x - w / 2), y = p && Math.round(p.y - h - 4);
        // a label that would sit under a panel or off screen is left out rather than drawn half hidden
        const hide = !p || x < 0 || y < 0 || x + w > innerWidth || panels.some((r) => x < r.right && x + w > r.left && y < r.bottom && y + h > r.top);
        e.hidden = hide; if (!hide) e.style.transform = "translate(" + x + "px," + y + "px)";
      });
      if (api.selected < 0) return;
      const p = api.screen(api.selected);
      tag.hidden = !p.visible;
      tag.style.transform = "translate(" + Math.round(Math.min(p.x + 16, cv.clientWidth - tag.offsetWidth - 8)) + "px," + Math.round(Math.max(p.y - 30, 6)) + "px)";
    },
  });
  window.__core = scene;
} catch (err) { console.warn("Core scene unavailable, showing the poster:", err); root.classList.add("no-scene"); }
</script>
